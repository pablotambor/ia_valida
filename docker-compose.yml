services:
  postgres:
    image: postgres:16-alpine
    container_name: validacao-docs-postgres
    environment:
      POSTGRES_DB: validacao_documentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
