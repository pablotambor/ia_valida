# Servidor
server.port=8080

# Limite de upload (imagens e PDFs)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Banco de dados - Por padrão usa H2 em memória para teste rápido.
# Para usar PostgreSQL (via docker-compose), ative o profile: --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:validacao_documentos;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Tesseract OCR
app.ocr.datapath=${TESSDATA_PREFIX:./tessdata}
app.ocr.language=${TESSERACT_LANG:por}

# Integração com IA / LLM (modo: "openai", "gemini" ou "fallback" para extração local via regex)
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Regras de negócio do MVP
app.validacao.prazo-maximo-dias=90
app.validacao.tamanho-minimo-ocr=20

# rodar apenas mvn spring-boot:run sem digitar -Dspring-boot.run.profiles=postgres toda vez.
spring.profiles.active=postgres